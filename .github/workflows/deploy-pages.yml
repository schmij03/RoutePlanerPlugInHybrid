# Veröffentlicht die App bei jedem Push auf main.
#
# Hintergrund: GitHub Pages wurde für dieses Repo automatisch mit dem
# gh-pages-Branch als Quelle aktiviert, und die Schutzregel der
# github-pages-Umgebung erlaubt nur Deployments von diesem Branch.
# Dieser Workflow spiegelt deshalb den Stand von main nach gh-pages –
# entwickelt und gepusht wird ausschließlich auf main, gh-pages ist nur
# noch ein automatisch verwaltetes Deploy-Artefakt.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # zum Aktualisieren des gh-pages-Branches

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      # Den kompletten Stand von main als neuen gh-pages-Stand pushen.
      # force-push ist hier gewollt: gh-pages hat keine eigene Historie.
      - name: Publish to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          # .github nicht mitveröffentlichen: gehört nicht zur Website, und
          # der GITHUB_TOKEN darf ohnehin keine Workflow-Dateien pushen
          rm -rf .github
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7} from main"
          git push --force origin gh-pages
