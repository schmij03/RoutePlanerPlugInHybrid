# Deployt die statische App bei jedem Push auf main direkt zu GitHub Pages.
# Damit ist der Hauptbranch die alleinige Quelle – ein separater
# gh-pages-Branch wird nicht mehr benötigt.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Pages-Deployment gleichzeitig; ältere laufende werden abgebrochen
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Stellt sicher, dass Pages aktiviert und auf "GitHub Actions" als Quelle gestellt ist
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Das gesamte Repo-Root als Artefakt hochladen (die App ist eine einzelne index.html)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
